<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>설문 집계기</title>
<style>
  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --text: #1d1d1b;
    --muted: #5f5f5a;
    --line: #d9d9d3;
    --accent: #1f5fae;
    --head: #efefea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615;
      --surface: #1f1f1d;
      --text: #ecece8;
      --muted: #a5a59e;
      --line: #3a3a36;
      --accent: #7fb0ec;
      --head: #2a2a27;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .note { color: var(--muted); margin: 0 0 20px; font-size: 0.95rem; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  textarea {
    display: block;
    width: 100%;
    min-height: 9rem;
    padding: 10px;
    font: inherit;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 16px; /* 휴대폰에서 입력할 때 화면이 확대되지 않게 */
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    resize: vertical;
    tab-size: 8;
  }
  textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions { margin: 8px 0 24px; }
  button {
    font: inherit;
    padding: 8px 16px;
    min-height: 44px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
  }
  .hint { color: var(--muted); }
  .summary { margin: 0 0 8px; color: var(--muted); }
  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
  }
  table { border-collapse: collapse; width: 100%; min-width: 520px; }
  th, td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  thead th { background: var(--head); font-weight: 600; }
  tbody tr:last-child td, tbody tr:last-child th { border-bottom: 0; }
  td { font-variant-numeric: tabular-nums; }
  th[scope="row"], thead th:first-child {
    position: sticky;
    left: 0;
    text-align: left;
    white-space: normal;
    min-width: 8em;
    max-width: 14em;
    overflow-wrap: anywhere;
    border-right: 1px solid var(--line);
  }
  th[scope="row"] { background: var(--surface); font-weight: 500; }
  thead th:first-child { z-index: 1; }
</style>
</head>
<body>

<main>
  <h1>설문 집계기</h1>
  <p class="note">엑셀에서 머리글 줄까지 복사해 붙여넣으세요. 첫 열(응답번호)은 집계하지 않습니다. 붙여넣은 내용은 이 화면 안에서만 계산되며, 어디로 보내거나 저장하지 않습니다.</p>

  <label for="input">응답 붙여넣기</label>
  <textarea id="input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
            placeholder="번호&#9;문항1&#9;문항2 …&#10;1&#9;5&#9;4 …"></textarea>
  <div class="actions"><button type="button" id="clear">비우기</button></div>

  <section id="output" aria-live="polite"></section>
</main>

<!-- 계산 로직: 화면과 무관한 순수 함수만 둔다. tests/tally.test.mjs가 이 블록만 읽어 시험한다. -->
<script id="tally-logic">
var SurveyTally = (function () {
  'use strict';

  // 규칙 ①~③: 앞뒤 공백을 지운 값으로 판정한다.
  function classify(cell) {
    var t = String(cell == null ? '' : cell).trim();
    if (t === '') return 'blank';
    if (t.length === 1 && t >= '1' && t <= '5') return 'valid';
    return 'excluded';
  }

  // 합과 개수가 정수이므로 정수 계산으로 소수 셋째 자리에서 반올림한다(부동소수 오차 없음).
  function formatAverage(sum, count) {
    if (count === 0) return '-';
    var hundredths = Math.floor((sum * 200 + count) / (2 * count));
    var whole = Math.floor(hundredths / 100);
    var frac = hundredths % 100;
    return whole + '.' + (frac < 10 ? '0' : '') + frac;
  }

  function isBlankLine(cells) {
    return cells.every(function (c) { return c.trim() === ''; });
  }

  // 머리글 포함 탭 구분 글을 집계한다. 첫 열(응답번호)은 집계하지 않는다.
  // 머리글이 없으면 null을 돌려준다.
  function tally(text) {
    var lines = String(text == null ? '' : text).split(/\r\n|\n|\r/);
    var start = 0;
    while (start < lines.length && isBlankLine(lines[start].split('\t'))) start++;
    if (start >= lines.length) return null;

    var header = lines[start].split('\t');
    var stats = header.slice(1).map(function (name) {
      return { name: name.trim(), valid: 0, blank: 0, excluded: 0, sum: 0 };
    });
    var responseCount = 0;

    for (var r = start + 1; r < lines.length; r++) {
      var cells = lines[r].split('\t');
      if (isBlankLine(cells)) continue;           // 모든 칸이 빈 줄은 무시
      responseCount++;
      for (var q = 0; q < stats.length; q++) {     // 남는 칸은 보지 않으므로 버려진다
        var cell = cells[q + 1];                   // 모자란 칸은 undefined → 빈 응답
        var kind = classify(cell);
        if (kind === 'valid') {
          stats[q].valid++;
          stats[q].sum += Number(cell.trim());
        } else if (kind === 'blank') {
          stats[q].blank++;
        } else {
          stats[q].excluded++;
        }
      }
    }

    return {
      responseCount: responseCount,
      questions: stats.map(function (s) {
        return {
          name: s.name,
          valid: s.valid,
          blank: s.blank,
          excluded: s.excluded,
          average: formatAverage(s.sum, s.valid)
        };
      })
    };
  }

  return { classify: classify, formatAverage: formatAverage, tally: tally };
})();
</script>

<!-- 화면: 입력을 읽어 계산 로직에 넘기고 결과 표를 그린다. 붙여넣은 값은 textContent로만 넣는다. -->
<script id="tally-ui">
(function () {
  'use strict';
  var input = document.getElementById('input');
  var output = document.getElementById('output');
  var clearButton = document.getElementById('clear');

  function el(tag, text, attrs) {
    var node = document.createElement(tag);
    if (text != null) node.textContent = text;
    if (attrs) for (var k in attrs) node.setAttribute(k, attrs[k]);
    return node;
  }

  function message(text) {
    output.replaceChildren(el('p', text, { 'class': 'hint' }));
  }

  function render() {
    var result = SurveyTally.tally(input.value);
    if (result === null) {
      message('엑셀에서 머리글 줄까지 복사해 위 칸에 붙여넣으면 문항별 결과가 여기에 나옵니다.');
      return;
    }
    if (result.questions.length === 0) {
      message('문항 열이 없습니다. 첫 열(응답번호) 다음에 문항 열이 탭으로 나뉘어 있어야 합니다.');
      return;
    }

    var table = el('table');
    var head = el('tr');
    ['문항', '유효 응답 수', '평균', '빈 응답 수', '제외 수'].forEach(function (h) {
      head.appendChild(el('th', h, { scope: 'col' }));
    });
    table.appendChild(el('thead')).appendChild(head);

    var body = el('tbody');
    result.questions.forEach(function (q, i) {
      var row = el('tr');
      row.appendChild(el('th', q.name || '(문항 ' + (i + 1) + ')', { scope: 'row' }));
      [q.valid, q.average, q.blank, q.excluded].forEach(function (v) {
        row.appendChild(el('td', String(v)));
      });
      body.appendChild(row);
    });
    table.appendChild(body);

    var wrap = el('div', null, { 'class': 'table-wrap', tabindex: '0', role: 'region', 'aria-label': '문항별 결과' });
    wrap.appendChild(table);
    output.replaceChildren(
      el('p', '응답 ' + result.responseCount + '건 · 문항 ' + result.questions.length + '개', { 'class': 'summary' }),
      wrap
    );
  }

  input.addEventListener('input', render);
  clearButton.addEventListener('click', function () {
    input.value = '';
    render();
    input.focus();
  });
  render();
})();
</script>

</body>
</html>
